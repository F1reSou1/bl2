<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Участники сделки — установка</title>
  <style>
    body { margin: 0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2937; background: #f7faf9; }
    main { max-width: 560px; margin: 44px auto; padding: 28px; background: #fff; border: 1px solid #d7e8e2; border-radius: 16px; box-shadow: 0 12px 30px rgba(10, 113, 100, .08); }
    h1 { margin: 0 0 8px; font-size: 22px; color: #0a7164; }
    p { margin: 0 0 18px; color: #52606d; }
    .status { padding: 12px 14px; border-radius: 10px; background: #edf8f4; color: #0a5c52; }
    .error { background: #fff1f1; color: #a22d2d; }
  </style>
</head>
<body>
  <main>
    <h1>Участники сделки</h1>
    <p>Добавляю вкладку для заказчика, подопечного и исполнителя, а также нужные поля сделки.</p>
    <div id="status" class="status">Подключаю приложение…</div>
  </main>

  <script src="https://unpkg.com/@bitrix24/b24jssdk@1/dist/umd/index.min.js"></script>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const widgetUrl = `${location.origin}/api/bitrix/participants/widget`;
      const fieldsToCreate = [
        { code: 'CARE_RECIPIENT', xmlId: 'bl_care_recipient', label: 'Подопечный' },
        { code: 'CARE_EXECUTOR', xmlId: 'bl_care_executor', label: 'Сиделка / исполнитель' }
      ];

      function setStatus(message, isError) {
        status.textContent = message;
        status.classList.toggle('error', Boolean(isError));
      }

      async function call(b24, method, params) {
        const response = await b24.actions.v2.call.make({ method, params, requestId: crypto.randomUUID() });
        if (!response.isSuccess) throw new Error(response.getErrorMessages().join('; ') || `Не выполнен ${method}`);
        return response.getData()?.result;
      }

      try {
        const b24 = await B24Js.initializeB24Frame();
        await call(b24, 'placement.bind', {
          PLACEMENT: 'CRM_DEAL_DETAIL_TAB',
          HANDLER: widgetUrl,
          TITLE: 'Участники сделки',
          LANG_ALL: { ru: { TITLE: 'Участники сделки' } }
        });

        const existing = await call(b24, 'crm.deal.userfield.list', { order: { ID: 'ASC' } });
        for (const field of fieldsToCreate) {
          const expected = `UF_CRM_${field.code}`;
          const found = Array.isArray(existing) && existing.some(item => item.FIELD_NAME === expected || item.XML_ID === field.xmlId);
          if (found) continue;
          await call(b24, 'crm.deal.userfield.add', {
            fields: {
              FIELD_NAME: field.code,
              XML_ID: field.xmlId,
              LABEL: field.label,
              USER_TYPE_ID: 'crm',
              SORT: field.code === 'CARE_RECIPIENT' ? 310 : 320,
              SETTINGS: { CONTACT: 'Y' }
            }
          });
        }
        await b24.installFinish();
        setStatus('Готово. В карточке сделки появилась вкладка «Участники сделки».');
      } catch (error) {
        console.error(error);
        setStatus(`Не удалось установить приложение: ${error.message || 'неизвестная ошибка'}`, true);
      }
    })();
  </script>
</body>
</html>
